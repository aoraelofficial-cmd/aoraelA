<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양자회담 관리</title>
<style>
:root{--bg:#f2f4f3;--pn:#fff;--ink:#15232b;--mut:#667780;--ln:#d9dfdd;--pri:#0f5c5a;--pri-t:#e0efee;--seal:#b3362f;--ok:#1d7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0f171b;--pn:#162227;--ink:#e4ecea;--mut:#8fa2a8;--ln:#26363c;--pri:#4fb8b2;--pri-t:#173a3a;--seal:#e0665e;--ok:#5fc58f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#343a40;color:#fff;border-bottom:1px solid #202428} header .btn{color:#fff;border-color:#68727b} header #apiTxt{color:#d6dbe0}
header h1{font-size:17px;margin:0;flex:1}
#apiTxt{color:var(--mut);font-size:13px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 54px)}
aside{border-right:1px solid var(--ln);background:var(--pn)}
.ah{flex-wrap:wrap;gap:8px;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
.ri{display:block;padding:12px 16px;border-bottom:1px solid var(--ln);border-left:3px solid transparent;color:inherit;text-decoration:none}
.ri.on{background:var(--pri-t);border-left-color:var(--pri)}
.ri b{display:block}.ri span,.ri small{display:block;color:var(--mut);font-size:13px}
.bar{display:flex;gap:2px;margin:6px 0 3px}.bar u{flex:1;height:4px;background:var(--ln)}.bar u.on{background:var(--pri)}
main{padding:24px 28px;min-width:0}
h2{margin:0;font-size:22px}h3{font-size:15px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top p{margin:2px 0 0;color:var(--mut)}
.steps{list-style:none;display:flex;padding:0;margin:20px 0;overflow-x:auto}
.steps li{flex:1;min-width:74px;text-align:center;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--ln)}
.steps li.done:not(:last-child)::after{background:var(--pri)}
.step{position:relative;z-index:1;background:none;border:0;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;padding:0}
.step b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--pn);border:2px solid var(--ln);font-size:13px;color:var(--ink)}
.done .step b{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.cur .step b{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-t)}
.cur .step{color:var(--ink);font-weight:600}
.gate .step b{border-color:var(--seal);border-radius:7px}
.step:disabled{cursor:not-allowed}
.seal{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1.5px solid var(--seal);border-radius:6px;padding:14px 16px;margin-bottom:18px}
.seal>div{flex:1;min-width:220px}.seal p{margin:2px 0 0;font-size:13px;color:var(--mut)}.seal input{width:160px;margin:0}
.btn{font:inherit;font-size:14px;padding:7px 13px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.btn.sm{padding:4px 9px;font-size:13px}.btn.danger{color:var(--seal)}
.btn.stamp{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600}
:is(.btn,input,textarea,select,.step,.ri,.tabs button,summary):focus-visible{outline:2px solid var(--pri);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,textarea,select{display:block;width:100%;margin-top:3px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}
.row input,.row select{width:auto;flex:1;min-width:110px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:18px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;padding:9px 14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pri);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.item{border-top:1px solid var(--ln);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.item>div{flex:1;min-width:0}.item small{color:var(--mut)}
details.art{border:1px solid var(--ln);border-radius:6px;margin-bottom:8px;background:var(--pn)}
details.art>summary{padding:10px 14px;cursor:pointer}.art .in{padding:0 14px 14px}
.tag{font-size:12px;padding:1px 8px;border-radius:9px;background:var(--pri-t);color:var(--pri);margin-left:6px}
.tag.approved{background:var(--ok);color:var(--bg)}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tool input{flex:1;min-width:200px;margin:0}
details.src{margin-bottom:14px}details.src summary{cursor:pointer;color:var(--pri);margin-bottom:8px}
.hint{color:var(--mut);font-size:13px}.empty{color:var(--mut);padding:36px 0}
dialog{border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--ink);width:min(460px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}#toast.err{background:var(--seal);color:#fff}
#busy{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);display:none;z-index:9}#busy.on{display:block}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--ln)}main{padding:16px}.cols{grid-template-columns:1fr}}
.og{display:flex;justify-content:space-between;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--ln);font-size:13px}.og small{color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:0 0 6px}label.chk input{width:auto;margin:0}
.art.pastel-agenda>summary{background:#e6f4ea}.art.pastel-minutes>summary{background:#e8e0f8}.art.pastel-minutes_a>summary{background:#e0eef8}.art.pastel-minutes_b>summary{background:#fff0cc}.art.pastel-email>summary{background:#f9e0e6}.art.pastel-transcript>summary{background:#e0f3f2}.art.pastel-feedback>summary{background:#f5e5d5}.art.pastel-other>summary{background:#edf0f2}.art>summary{border-radius:8px;transition:filter .15s}.art .a-b{min-height:420px}.art .in{max-height:none}.artifacts-help{color:var(--mut);font-size:13px;margin:8px 0}.art>summary:hover{filter:brightness(.97)}
</style>
</head>
<body>
<header><h1>AOREAL 양자회담 관리</h1><span id="apiTxt">이 브라우저에 저장</span><button class="btn sm" data-a="settings">설정</button></header>
<div class="wrap">
<aside><div class="ah"><b>회의 세트</b><span class="row"><button class="btn sm" data-a="insight">인사이트</button><button class="btn sm" data-a="bulkorgs">기관 일괄 등록</button><button class="btn pri sm" data-a="newset">새 세트</button></span></div><div id="rail"></div></aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog><div id="toast"></div><div id="busy"></div>
<script>
const $=s=>document.querySelector(s),main=$('#main'),dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v=id=>($('#'+id)?.value||'').trim();
const KIND={agenda:'아젠다',minutes:'회의록',minutes_a:'회의록 전문(A)',minutes_b:'경영진 요약(B)',email:'발송 메일',transcript:'전사본',feedback:'메일 회신'};
let cfg={base:'',actor:'',gkey:'',model:'gemini-3.8-flash'},sets=[],D=null,cur=null,tab='info',mail={sub:'',body:'',kind:'agenda',lang:'ko'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('mtg_cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('mtg_cfg',JSON.stringify(cfg))}catch(e){}};

const DB_KEY='mtg_db';
const ST=[{n:1,label:'아젠다 초안',desc:'이번 회의에서 다룰 의제 초안을 작성하는 단계'},{n:2,label:'일시·참석자',desc:'회의 일시와 방식을 정하고 참석자 명단을 확정하는 단계'},{n:3,label:'일정 조율',desc:'제안한 일시를 상대 기관과 주고받으며 조율하는 단계'},{n:4,label:'확정·재공지',desc:'일시·장소·아젠다를 확정해 참석자에게 재공지하는 단계'},{n:5,label:'회의 진행',desc:'회의가 진행 중이거나 막 끝난 단계'},{n:6,label:'회의록 초안',desc:'회의 내용을 바탕으로 회의록 초안을 작성하는 단계'},{n:7,label:'대표 승인',gate:true,desc:'사람이 직접 확인하는 단계. 대표가 회의록·아젠다·발송 문안을 최종 검토하고 승인'},{n:8,label:'참석자 배포',desc:'승인된 문서를 참석자에게 발송·공유하는 단계'},{n:9,label:'확인 회수',desc:'상대측의 확인·회신을 받고 후속조치 이행을 체크하는 단계'},{n:10,label:'다음 아젠다',desc:'미결 후속조치를 다음 회의 아젠다로 넘기는 마무리 단계'}];
let db;
function load(){let j=null;try{j=JSON.parse(localStorage.getItem(DB_KEY))}catch(e){}db=Object.assign({orgs:[],sets:[],meetings:[],attendees:[],artifacts:[],actions:[],footprint:[]},j||{})}
function persist(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){throw new Error('브라우저 저장 공간이 부족해요. 설정에서 백업을 받고 오래된 세트를 정리하세요.')}}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const need=(x,m)=>{if(!x)throw new Error(m);return x};
const setF=(o,b,fs)=>fs.forEach(f=>{if(b[f]!==undefined)o[f]=b[f]});
const del=(k,f)=>{db[k]=db[k].filter(x=>!f(x))};
const mtgOf=sid=>db.meetings.find(x=>x.set_id===sid)||{};
const orgOf=id=>db.orgs.find(o=>o.id===id)||{};
function adv(mid,ev){const m=db.meetings.find(x=>x.id===mid);if(!m)return;if(ev==='agenda'&&m.stage===1)m.stage=2;else if(ev==='minutes'&&m.stage<6)m.stage=6;else if(ev==='email'&&m.stage===8)m.stage=9}
function brief(s){const m=mtgOf(s.id),a=db.actions.filter(x=>x.meeting_id===m.id);return{id:s.id,code:s.code,title:s.title,org_name:orgOf(s.org_id).name,stage:m.stage,stage_label:ST[m.stage-1]?.label,action_total:a.length,action_done:a.filter(x=>x.status==='done').length}}
async function api(m,p,b={}){
  load();
  const [r,id0,sub,cid]=p.split('/').filter(Boolean).slice(1),id=id0&&decodeURIComponent(id0);
  let out={};
  if(r==='orgs')out=db.orgs;
  else if(r==='sets'){
    if(m==='GET'&&!id)out=db.sets.map(brief);
    else if(m==='GET'){
      const s=need(db.sets.find(x=>x.id===id),'세트를 찾을 수 없어요'),mt=mtgOf(id),o=orgOf(s.org_id);
      out={set:{...mt,...s,meeting_id:mt.id,org_name:o.name,org_country:o.country},stages:ST,
        attendees:db.attendees.filter(a=>a.meeting_id===mt.id),artifacts:db.artifacts.filter(a=>a.meeting_id===mt.id),actions:db.actions.filter(a=>a.meeting_id===mt.id),
        footprint:db.footprint.filter(f=>f.org_id===s.org_id).sort((x,y)=>(y.occurred_on||'').localeCompare(x.occurred_on||''))};
    }else if(m==='POST'){
      if(db.sets.some(x=>x.id===b.id))throw new Error('이미 있는 세트 ID예요: '+b.id);
      let oid=b.org_id;
      if(!oid){const ex=db.orgs.find(o=>o.name===b.org_name);oid=ex?ex.id:uid('org_');if(!ex)db.orgs.push({id:oid,name:b.org_name,country:''})}
      db.sets.push({id:b.id,org_id:oid,code:b.id.toUpperCase(),title:b.title||''});
      db.meetings.push({id:'mtg-'+b.id,set_id:b.id,stage:1,scheduled_at:b.scheduled_at||'',venue:b.venue||'',mode:'video',purpose:b.purpose||''});
      out={id:b.id};
    }else if(m==='DELETE'){
      need(db.sets.find(x=>x.id===id),'세트를 찾을 수 없어요');
      const mid=mtgOf(id).id;
      ['attendees','artifacts','actions','footprint'].forEach(k=>del(k,x=>x.meeting_id===mid));
      del('meetings',x=>x.set_id===id);del('sets',x=>x.id===id);
    }
  }else if(r==='meetings'){
    const mt=need(db.meetings.find(x=>x.id===id),'회의를 찾을 수 없어요');
    if(sub==='approve'){
      if(mt.stage!==7)throw new Error('승인은 7단계에서만 할 수 있어요 (현재 '+mt.stage+'단계)');
      const now=new Date().toISOString();
      db.artifacts.forEach(a=>{if(a.meeting_id===id)Object.assign(a,{status:'approved',approved_by:b.actor,approved_at:now})});
      Object.assign(mt,{stage:8,approved_by:b.actor,approved_at:now});
    }else if(sub==='attendees'){
      if(m==='POST')db.attendees.push({meeting_id:id,contact_id:uid('c_'),side:b.side,name:b.name,title:b.title||'',email:b.email||''});
      else del('attendees',a=>a.meeting_id===id&&a.contact_id===cid);
    }else{
      if(b.stage===8)throw new Error('8단계는 대표 승인으로만 바뀌어요');
      setF(mt,b,['stage','scheduled_at','venue','mode','platform','join_url','purpose']);
    }
  }else if(r==='artifacts'){
    if(m==='POST'){db.artifacts.push({id:uid('art_'),meeting_id:b.meeting_id,kind:b.kind,version:1,lang:b.lang||'ko',title:b.title||'',body:b.body||'',status:'draft'});adv(b.meeting_id,b.kind)}
    else{
      const a=need(db.artifacts.find(x=>x.id===id),'아웃풋을 찾을 수 없어요');
      if(m==='PATCH'){setF(a,b,['title','body','status','lang','version']);adv(a.meeting_id,a.kind)}else del('artifacts',x=>x.id===id);
    }
  }else if(r==='actions'){
    if(m==='POST')db.actions.push({id:uid('act_'),meeting_id:b.meeting_id,category:b.category||'—',description:b.description,owner:b.owner||'TBD',due_on:b.due_on||'',status:'open'});
    else if(m==='PATCH')setF(need(db.actions.find(x=>x.id===id),'후속조치를 찾을 수 없어요'),b,['status','owner','due_on','category','description']);
    else del('actions',x=>x.id===id);
  }else if(r==='footprint'){
    if(m==='POST')db.footprint.push({id:uid('fp_'),org_id:b.org_id,meeting_id:b.meeting_id,occurred_on:b.occurred_on||new Date().toISOString().slice(0,10),title:b.title||'',one_liner:b.one_liner});
    else del('footprint',x=>x.id===id);
  }
  if(m!=='GET')persist();
  return JSON.parse(JSON.stringify(out));
}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',err?5000:2200)}
async function run(fn){$('#busy').className='on';try{const m=await fn();if(m)toast(m)}catch(e){toast(e.message,1)}finally{$('#busy').className=''}}
async function loadSets(){sets=await api('GET','/api/sets');renderRail()}
async function openSet(id){if(cur!==id)mail={sub:'',body:'',kind:'agenda',lang:'ko'};cur=id;D=await api('GET','/api/sets/'+encodeURIComponent(id));render()}
const reload=async()=>{await loadSets();if(cur)await openSet(cur)};
async function route(){const id=decodeURIComponent(location.hash.slice(2));if(id==='insight'){cur=null;D=null;renderInsight()}else if(id)await openSet(id);else{cur=null;D=null;render()}}
addEventListener('hashchange',()=>run(route));

function renderRail(){
  const g={};sets.forEach(x=>(g[x.org_name||'기관 미정']??=[]).push(x));
  $('#rail').innerHTML=sets.length?Object.entries(g).map(([o,ss])=>`<div class="og"><b>${esc(o)}</b><small>세트 ${ss.length}</small></div>`+ss.map(x=>`<a class="ri ${x.id===cur?'on':''}" href="#/${encodeURIComponent(x.id)}"><b>${esc(x.code)} ${esc(x.title||'')}</b><i class="bar">${Array.from({length:10},(_,i)=>`<u class="${i<x.stage?'on':''}"></u>`).join('')}</i><small>${x.stage}단계 ${esc(x.stage_label||'')}${x.action_total?`, 후속조치 ${x.action_done}/${x.action_total}`:''}</small></a>`).join('')).join(''):'<p class="empty" style="padding:16px">아직 세트가 없어요. 기관 일괄 등록이나 새 세트로 시작하세요.</p>';
}
const fld=(id,l,val,ph='')=>`<label>${l}<input id="${id}" value="${esc(val)}" placeholder="${ph}"></label>`;

function render(){
  const openIds=[...document.querySelectorAll('details[data-id][open]')].map(d=>d.dataset.id);
  renderRail();
  if(!D){main.innerHTML='<div class="empty"><h3>회의 세트를 선택하세요</h3><p>왼쪽 목록에서 세트를 고르거나, 새 세트를 만들어 시작하세요.</p></div>';return}
  const s=D.set;
  const tabs=[['info','개요'],['art',`아웃풋 ${D.artifacts.length}`],['act',`후속조치 ${D.actions.length}`],['mail','메일 발송'],['fp','발자취']];
  main.innerHTML=`<div class="top"><div><h2>${esc(s.code)} ${esc(s.title||'')}</h2><p>${esc(s.org_name)}${s.org_country?' ('+esc(s.org_country)+')':''}</p></div><button class="btn sm danger" data-a="delset">세트 삭제</button></div>
  <ol class="steps">${D.stages.map(x=>`<li class="${x.n<s.stage?'done':''} ${x.n==s.stage?'cur':''} ${x.gate?'gate':''}"><button class="step" data-a="stage" data-n="${x.n}" ${x.n==8?'disabled':''} title="${esc(x.desc)}"><b>${x.n}</b>${esc(x.label)}</button></li>`).join('')}</ol>
  ${s.stage===7?`<div class="seal"><div><b>대표 승인 대기</b><p>회의록, 아젠다, 발송 문안을 검토한 뒤 승인하면 참석자 배포 단계로 넘어가요.</p></div><input id="actor" value="${esc(cfg.actor)}" placeholder="승인자 이름"><button class="btn stamp" data-a="approve">승인하기</button></div>`:''}
  ${s.approved_by?`<p class="hint">승인: ${esc(s.approved_by)} (${esc(s.approved_at||'')})</p>`:''}
  <nav class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>
  <section>${{info:paneInfo,art:paneArt,act:paneAct,mail:paneMail,fp:paneFp}[tab]()}</section>`;
  openIds.forEach(i=>{const d=main.querySelector(`details[data-id="${i}"]`);if(d)d.open=true});
}

function paneInfo(){
  const s=D.set,side=k=>D.attendees.filter(a=>a.side===k);
  const grp=(k,l)=>`<p class="hint" style="margin:10px 0 0">${l}</p>${side(k).map(a=>`<div class="item"><div><b>${esc(a.name)}</b> <small>${esc(a.title||'')}</small><br><small>${esc(a.email||'')}</small></div><button class="btn sm danger" data-a="delatt" data-c="${a.contact_id}">삭제</button></div>`).join('')||'<p class="hint">없음</p>'}`;
  return `<div class="cols"><div><h3>회의 정보</h3>

async function gem(prompt,temp=.4,max=8192){
  if(!cfg.gkey)throw new Error('API 설정에서 Gemini 키를 먼저 입력하세요.');
  let r;
  try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model||'gemini-3.8-flash')}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':cfg.gkey},body:JSON.stringify({contents:[{parts:typeof prompt==='string'?[{text:prompt}]:prompt}],generationConfig:{temperature:temp,maxOutputTokens:max}})})}
  catch(e){throw new Error('Gemini에 연결할 수 없어요. 네트워크를 확인하세요.')}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(j?.error?.message||'Gemini 오류 (HTTP '+r.status+')');
  const t=(j?.candidates?.[0]?.content?.parts||[]).map(p=>p.text).filter(Boolean).join('\n');
  if(!t)throw new Error('Gemini가 응답을 만들지 못했어요'+(j?.candidates?.[0]?.finishReason?' ('+j.candidates[0].finishReason+')':''));
  return t;
}

async function filePart(f){
  if(f.type.startsWith('text/')||/\.(txt|md)$/i.test(f.name))return{text:await f.text()};
  const ext=(f.name.split('.').pop()||'').toLowerCase(),mm={m4a:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',flac:'audio/flac',pdf:'application/pdf'},mime=mm[ext]||f.type;
  if(!(mime.startsWith('audio/')||mime==='application/pdf'))throw new Error('지원하지 않는 파일이에요. 음성, PDF, 텍스트 파일만 올릴 수 있어요.');
  if(f.size>14*1024*1024)throw new Error('파일이 14MB보다 커요. 음성은 압축하거나 나눠서 올려 주세요.');
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('파일을 읽지 못했어요'));r.readAsDataURL(f)});
  return{inlineData:{mimeType:mime,data}};
}

    if(!(a.body||'').trim())throw new Error('내용이 없는 아웃풋이에요');
    const label=KIND[a.kind]||'아웃풋';
    mail.sub=`[${D.set.code}] ${label} 전달 및 확인 요청`;
    mail.body=`안녕하세요.\n\n${D.set.org_name||''} 양자회담 관련 ${label}을(를) 전달드립니다.\n\n[${a.title||label}]\n${a.body}\n\n내용을 확인하시고 의견이나 수정사항이 있으면 회신 부탁드립니다.\n\n감사합니다.`;
    tab='mail'; render(); return `${label}을 메일발송 목록에 넣었어요. 수신자를 확인한 뒤 발송하세요.`;
  },
  async toactions(t,d){
    const a=D.artifacts.find(x=>x.id===d.dataset.id); if(!a)throw new Error('아웃풋을 찾을 수 없어요');
    const raw=await gem(`회의록 또는 문서에서 실제로 명시된 후속조치만 추출하세요. 추측하지 말고, 기한이 없으면 TBD로 표시하세요. JSON 배열만 출력하세요. 각 항목은 {"category":"구분","description":"조치사항","owner":"담당자 또는 기관","due_on":"기한 또는 TBD"}입니다.\n\n${a.body}`,.1,8192);
    let rows; try{rows=JSON.parse(raw.replace(/^```json\s*|\s*```$/g,''))}catch(e){throw new Error('AI 결과를 후속조치로 변환하지 못했어요. 다시 시도하세요.')}
    let n=0; for(const x of rows){if(x.description){await api('POST','/api/actions',{meeting_id:D.set.meeting_id,category:x.category||'회의록',description:x.description,owner:x.owner||'TBD',due_on:x.due_on||'TBD'});n++}}
    await openSet(cur); return `${n}건을 후속조치로 넘겼어요. 후속조치 탭과 메일 발송 탭에서 확인하세요.`;
  },
  async adel(t,d){if(!confirm('이 아웃풋을 삭제할까요?'))return;await api('DELETE','/api/artifacts/'+d.dataset.id);await openSet(cur);return '삭제했어요'},
  async newart(){await api('POST','/api/artifacts',{meeting_id:D.set.meeting_id,kind:v('n-kind'),title:v('n-title'),body:$('#n-body').value});await reload();return '아웃풋을 추가했어요'},
  async actadd(){
    if(!v('x-desc'))throw new Error('후속조치 내용을 입력하세요');
    await api('POST','/api/actions',{meeting_id:D.set.meeting_id,category:v('x-cat')||undefined,description:v('x-desc'),owner:v('x-owner')||undefined,due_on:v('x-due')||undefined});await reload();return '후속조치를 추가했어요';
  },
  async acttog(t){await api('PATCH','/api/actions/'+t.dataset.id,{status:t.dataset.s});await reload()},
  async actdel(t){await api('DELETE','/api/actions/'+t.dataset.id);await reload();return '삭제했어요'},
  async fpadd(){
    if(!v('f-one'))throw new Error('한 줄 요약을 입력하세요');
    await api('POST','/api/footprint',{org_id:D.set.org_id,meeting_id:D.set.meeting_id,occurred_on:v('f-on')||undefined,title:v('f-title'),one_liner:v('f-one')});await openSet(cur);return '기록을 추가했어요';
  },
  async fpdel(t){await api('DELETE','/api/footprint/'+t.dataset.id);await openSet(cur);return '삭제했어요'}
};
document.addEventListener('click',e=>{
  if(e.target.closest('[data-x]'))return dlg.close();
  const t=e.target.closest('[data-a]');if(!t||!H[t.dataset.a])return;
  run(()=>H[t.dataset.a](t,t.closest('details[data-id]')));
});
run(async()=>{await loadSets();await route()});
</script>
</body>
</html>
